en:
  errors:
    messages:
      exceeds_remaining: "Cannot exceed the remaining quantity needed (%{max})"
      photos_missing: "Please add at least one photo of your item"
      tags_or_comment_required: "Please select at least one item or add a comment"
  activerecord:
    attributes:
      feedback:
        tags: "Feedback items"
        comment: "Additional feedback"
      charity:
        org_name: "Organization name"
        address: "Address"
      address: &en_address_attributes
        postal_code: "Postal code"
        region: "Region"
        prefecture: "Prefecture"
        city: "City / ward"
        street: "Street address"
        building: "Building / room"
        recipient_name: "Recipient name"
      # Nested errors on a charity's address use this key
      charity/address: *en_address_attributes
      donor:
        display_name: "Display name"
